name: CI

on: 
    push:
        branches: [dev, main]
    pull_request:
        branches: [dev, main]

jobs:
    test-backend:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                    python-version: '3.11'

            - name: Install dependencies
              working-directory: deadline-app/backend
              run: pip install -r requirements.txt

            - name: Run tests
              working-directory: deadline-app/backend
              run: pytest tests/ -v

    build-docker:
        runs-on: ubuntu-latest
        needs: test-backend

        steps:
            - uses: actions/checkout@v3

            - name: Build backend image
              run: docker build ./deadline-app/backend

            - name: Build frontend image
              run: docker build ./deadline-app/frontend